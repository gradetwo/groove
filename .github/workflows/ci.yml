name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  # The heavy checks live in the `nightly` job: they are slow (the full 7-target browser
  # matrix) or environment-sensitive in ways that would report flakiness as a code failure
  # on every pull request. A dedicated nightly slot keeps them running without making every
  # push pay for them; `workflow_dispatch` runs the same set on demand.
  #
  # 03:17 UTC rather than 03:00: the top of the hour is when scheduled jobs queue up
  # behind everyone else's.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  validate:
    name: Typecheck, Lint, Unit Tests & Build
    runs-on: ubuntu-latest
    # `nightly` owns the scheduled run; see the schedule comment above.
    if: github.event_name != 'schedule'

    steps:
      # v5 actions run on the Node 24 runtime. The v4 tags target Node 20, which GitHub
      # deprecated on runners (2025-09-19) and now forces onto Node 24 with a warning.
      # This is a *different* Node version from `.nvmrc` below: this one is the workflow's
      # own runtime, `.nvmrc` is the project's floor (`engines` / `engine-strict`).
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # `.nvmrc` is the floor `engines` declares, so CI runs the *minimum* supported
          # version rather than a newer one that would hide a too-high requirement.
          #
          # It used to say `20`, which no longer works: jsdom 30 (and the undici 8 it
          # vendors, which calls `worker_threads.markAsUncloneable`) requires Node
          # ^22.22.2, so on Node 20 the jsdom environment fails to construct — 190
          # unhandled errors, no test executed, 0% coverage, and a red coverage gate that
          # said nothing about the real problem. `engine-strict` in `.npmrc` now makes the
          # install itself fail loudly on an unsupported Node.
          node-version-file: ".nvmrc"
          cache: "npm"

      # Printed *before* the install, so an engine rejection shows which Node asked for it.
      # (npm validates `engines` before running any script, so a `preinstall` hook cannot do this.)
      - name: Node & npm versions
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      # The runner's own Node runtime for `uses:` actions is a separate axis from the
      # project's Node floor below; this gate fails on an action still tagged for the
      # deprecated Node 20 runtime.
      - name: Actions Runtime Gate
        run: npm run check:actions

      - name: Version Single-Source Check
        run: npm run version:check

      - name: Documentation Baseline Check
        run: npm run docs:check

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Code Quality
        run: npm run lint

      - name: Red-Line Gate
        run: npm run redlines

      - name: Unit Tests & Coverage
        run: npm run test:coverage

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Genre Database Schema Lint
        run: npm run lint:data

      # Cross-database audit (159 genres, 300 relations, timeline stories) that used to
      # be an orphan script nothing invoked.
      - name: Genre Database Audit
        run: npm run data:lint

      - name: Production Build
        run: npm run build

      - name: Bundle Budget & Performance Gate
        run: npm run check:budget

  e2e:
    name: E2E Test Matrix (Playwright)
    runs-on: ubuntu-latest
    needs: validate
    # Skipped on schedule: `nightly` runs the same full matrix plus coverage, the loudness baseline
    # freshness check and the performance gate, so a scheduled run would duplicate this job.
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Same floor as the `validate` job — see the comment there.
          node-version-file: ".nvmrc"
          cache: "npm"

      # Printed *before* the install, so an engine rejection shows which Node asked for it.
      # (npm validates `engines` before running any script, so a `preinstall` hook cannot do this.)
      - name: Node & npm versions
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Production Build
        run: npm run build

      # The **full** seven-target matrix on every push and pull request: three desktop browsers and the four
      # phone/tablet targets. It used to run the desktop profile only, on the grounds that the phone and tablet
      # surfaces were being rebuilt and would report failures the redesign would invalidate — that redesign has
      # shipped, the mobile targets have been green in `verify` for several releases, and a gate that skips two
      # thirds of the targets is how an iPad-only regression survives to production.
      - name: Cross-Browser & Cross-Device Test Matrix
        run: npm run test:e2e:all

      # E-10: Lighthouse is not installable in this environment, so the performance
      # gate is a real-browser measurement with deterministic assertions (no genre
      # data on first paint) plus reported FCP/LCP/CLS.
      - name: Performance Gate (real browser, local build)
        run: npm run perf:check

  # `CI / nightly`: everything that is too slow or too environment-sensitive to gate a push.
  #
  # What it adds over `validate` + `e2e`:
  #  - `test:e2e:all` — the full 7-target matrix, which the push-time gate now also runs
  #    (kept here as well so a scheduled run is complete on its own);
  #  - `test:coverage` — the coverage thresholds, which are stricter than the plain test run;
  #  - `check:loudness:fresh` — re-renders sampled genres in a fresh page and compares against
  #    the committed baseline, which needs a browser and ~1 minute but catches a baseline that
  #    no longer describes the code (that check exists because a stale one survived for weeks);
  #  - `perf:check` — the real-browser performance gate.
  #
  # Everything is uploaded (coverage + e2e-out), because a nightly failure is usually diagnosed
  # from the artifact rather than from the log.
  nightly:
    name: Nightly (full matrix, coverage, loudness freshness, perf)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Same floor as the push-time jobs — see the comment in `validate`.
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Node & npm versions
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Unit Tests & Coverage
        run: npm run test:coverage

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nightly-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Production Build
        run: npm run build

      # Needs a browser and the committed baseline; see the job comment.
      - name: Loudness Baseline Freshness
        run: npm run check:loudness:fresh

      - name: Full Browser & Device Matrix
        run: npm run test:e2e:all

      - name: Upload E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nightly-e2e
          path: e2e-out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Performance Gate (real browser, local build)
        run: npm run perf:check
