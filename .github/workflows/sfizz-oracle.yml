# The sfizz oracle, built from source — because sfizz publishes no Linux binary and no image, so CI has to compile it.
#
# Its job is narrow and worth stating: prove that the reference renderer in this environment reads exactly like the known one, **before** any comparison with this
# project's own engine is trusted. The numbers are pinned in `scripts/sfizz_oracle.mjs`; if a different sfizz produces different ones, the job goes red, because a
# comparison built on a different instrument measures the wrong thing.
name: sfizz oracle

on:
  workflow_dispatch:
    inputs:
      sfizz_ref:
        description: "sfizz-ui tag or branch to build (default: the pinned tag)"
        required: false
        default: "v1.2.3"

jobs:
  oracle:
    name: Build sfizz and pin its reading
    runs-on: ubuntu-24.04
    env:
      SFIZZ_REF: ${{ github.event.inputs.sfizz_ref || 'v1.2.3' }}
    steps:
      - uses: actions/checkout@v5

      # The build is the expensive part (a recursive clone plus a full compile), so the build tree is cached per ref. `cmake --build` on a warm cache is a no-op
      # rather than a rebuild, which keeps this job honest: the same steps run warm and cold, so a cache miss shows up as time and not as a different result.
      - name: Cache the sfizz build
        uses: actions/cache@v5
        with:
          path: sfizz-ui/build
          key: sfizz-ui-${{ env.SFIZZ_REF }}-ubuntu-24.04

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libsndfile1-dev libjack-jackd2-dev

      - name: Clone sfizz-ui
        run: |
          if [ ! -d sfizz-ui/.git ]; then
            git clone --recursive --branch "$SFIZZ_REF" --depth 1 https://github.com/sfztools/sfizz-ui.git sfizz-ui
          fi

      - name: Build sfizz_render
        run: |
          cmake -S sfizz-ui -B sfizz-ui/build -DCMAKE_BUILD_TYPE=Release -DSFIZZ_RENDER=ON
          cmake --build sfizz-ui/build --target sfizz_render -j"$(nproc)"

      - name: Prove the oracle reads like the known one
        env:
          SFIZZ_RENDER: ./sfizz-ui/build/clients/sfizz_render
        run: node scripts/sfizz_oracle.mjs
